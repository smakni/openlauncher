name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# A push to a branch with an open PR fires both the push and the pull_request
# event, which built every commit twice. Limiting push to main leaves branch
# builds to the PR event, and cancelling superseded runs means a quick series
# of pushes only builds the last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openlauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
